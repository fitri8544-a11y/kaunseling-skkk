<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Portal | Bimbingan & Kaunseling SK Kuala Ketil</title>

  <link rel="icon" type="image/png" href="assets/logo-sekolah.png">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

  <!-- Google Font -->
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:wght@600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    body {
      font-family: "DM Sans", sans-serif;
    }

    .display {
      font-family: "Fraunces", serif;
    }
  </style>
</head>

<body class="min-h-screen bg-[#eff8f3] flex items-center justify-center p-5">

  <main class="w-full max-w-md">

    <!-- BRAND -->
    <div class="text-center mb-7">

      <div
        class="w-20 h-20 mx-auto mb-4 bg-white rounded-2xl
               shadow-lg flex items-center justify-center p-2"
      >
        <img
          src="assets/logo-sekolah.png"
          alt="Logo SK Kuala Ketil"
          class="w-full h-full object-contain"
        >
      </div>

      <p
        class="text-xs font-bold tracking-[0.18em]
               text-emerald-700 uppercase mb-2"
      >
        Unit Bimbingan & Kaunseling
      </p>

      <h1 class="display text-3xl text-[#16332d]">
        Portal Admin
      </h1>

      <p class="text-sm text-slate-500 mt-2">
        SK Kuala Ketil
      </p>

    </div>


    <!-- LOGIN CARD -->
    <section
      class="bg-white rounded-[28px] shadow-xl
             border border-emerald-100 p-7 md:p-8"
    >

      <div class="mb-7">

        <h2 class="text-xl font-bold text-[#16332d]">
          Selamat Datang
        </h2>

        <p class="text-sm text-slate-500 mt-1">
          Log masuk untuk mengurus kandungan portal.
        </p>

      </div>


      <!-- MESSAGE -->
      <div
        id="loginMessage"
        class="hidden mb-5 p-3 rounded-xl text-sm"
      ></div>


      <!-- FORM -->
      <form id="loginForm" class="space-y-5">

        <!-- EMAIL -->
        <div>

          <label
            for="email"
            class="block text-sm font-semibold
                   text-slate-700 mb-2"
          >
            E-mel Admin
          </label>

          <div class="relative">

            <i
              data-lucide="mail"
              class="absolute left-4 top-1/2 -translate-y-1/2
                     w-5 h-5 text-slate-400"
            ></i>

            <input
              id="email"
              type="email"
              autocomplete="email"
              required
              placeholder="nama@moe.gov.my"
              class="w-full pl-12 pr-4 py-3.5 rounded-xl
                     border border-slate-200
                     focus:outline-none focus:ring-2
                     focus:ring-emerald-500
                     focus:border-transparent"
            >

          </div>

        </div>


        <!-- PASSWORD -->
        <div>

          <label
            for="password"
            class="block text-sm font-semibold
                   text-slate-700 mb-2"
          >
            Kata Laluan
          </label>

          <div class="relative">

            <i
              data-lucide="lock-keyhole"
              class="absolute left-4 top-1/2 -translate-y-1/2
                     w-5 h-5 text-slate-400"
            ></i>

            <input
              id="password"
              type="password"
              autocomplete="current-password"
              required
              placeholder="Masukkan kata laluan"
              class="w-full pl-12 pr-12 py-3.5 rounded-xl
                     border border-slate-200
                     focus:outline-none focus:ring-2
                     focus:ring-emerald-500
                     focus:border-transparent"
            >

            <button
              id="togglePassword"
              type="button"
              aria-label="Papar kata laluan"
              class="absolute right-4 top-1/2 -translate-y-1/2
                     text-slate-400 hover:text-emerald-700"
            >
              <i
                id="passwordIcon"
                data-lucide="eye"
                class="w-5 h-5"
              ></i>
            </button>

          </div>

        </div>


        <!-- LOGIN -->
        <button
          id="loginButton"
          type="submit"
          class="w-full bg-[#075e4c] text-white
                 font-semibold py-3.5 rounded-xl
                 hover:bg-[#06473a]
                 transition flex items-center
                 justify-center gap-2"
        >
          <i data-lucide="log-in" class="w-5 h-5"></i>

          <span id="loginButtonText">
            Log Masuk
          </span>
        </button>

      </form>


      <!-- BACK -->
      <div class="mt-6 pt-6 border-t border-slate-100 text-center">

        <a
          href="index.html"
          class="inline-flex items-center gap-2
                 text-sm font-semibold text-emerald-700
                 hover:text-emerald-900"
        >
          <i data-lucide="arrow-left" class="w-4 h-4"></i>
          Kembali ke Portal
        </a>

      </div>

    </section>


    <p class="text-center text-xs text-slate-400 mt-6">
      Portal Bimbingan & Kaunseling · SK Kuala Ketil
    </p>

  </main>


  <script>
    lucide.createIcons();


    // ===============================
    // SHOW / HIDE PASSWORD
    // ===============================

    const passwordInput =
      document.getElementById("password");

    const togglePassword =
      document.getElementById("togglePassword");


    togglePassword.addEventListener("click", () => {

      const isPassword =
        passwordInput.type === "password";

      passwordInput.type =
        isPassword ? "text" : "password";

      togglePassword.innerHTML =
        isPassword
          ? '<i data-lucide="eye-off" class="w-5 h-5"></i>'
          : '<i data-lucide="eye" class="w-5 h-5"></i>';

      lucide.createIcons();

    });
  </script>

  <script>
  // ==========================================
  // FIREBASE CONFIG
  // ==========================================

  const firebaseConfig = {
    apiKey: "AIzaSyA9R5jKqeJNvBHD-SIOuseAqyb_x909R3Q",
    authDomain: "bimbingankaunselingskkk.firebaseapp.com",
    projectId: "bimbingankaunselingskkk"
  };

  firebase.initializeApp(firebaseConfig);

  const auth = firebase.auth();


  // ==========================================
  // ADMIN YANG DIBENARKAN
  // ==========================================

  const PORTAL_ADMIN_EMAILS = [
    "fitrieusop@moe.gov.my",
    "g-88050609@moe-dl.edu.my"
  ];


  // ==========================================
  // ELEMENT
  // ==========================================

  const loginForm =
    document.getElementById("loginForm");

  const emailInput =
    document.getElementById("email");

  const loginButton =
    document.getElementById("loginButton");

  const loginButtonText =
    document.getElementById("loginButtonText");

  const loginMessage =
    document.getElementById("loginMessage");


  // ==========================================
  // MESSAGE
  // ==========================================

  function showLoginMessage(message, type = "error") {

    loginMessage.classList.remove(
      "hidden",
      "bg-red-50",
      "text-red-700",
      "border-red-200",
      "bg-emerald-50",
      "text-emerald-700",
      "border-emerald-200"
    );

    loginMessage.classList.add(
      "border"
    );

    if (type === "success") {

      loginMessage.classList.add(
        "bg-emerald-50",
        "text-emerald-700",
        "border-emerald-200"
      );

    } else {

      loginMessage.classList.add(
        "bg-red-50",
        "text-red-700",
        "border-red-200"
      );

    }

    loginMessage.textContent = message;
  }


  // ==========================================
  // LOGIN
  // ==========================================

  loginForm.addEventListener("submit", async (event) => {

    event.preventDefault();

    const email =
      emailInput.value.trim().toLowerCase();

    const password =
      passwordInput.value;


    // Semak admin dahulu
    if (!PORTAL_ADMIN_EMAILS.includes(email)) {

      showLoginMessage(
        "Akaun ini tidak mempunyai akses sebagai Admin Portal."
      );

      return;
    }


    loginButton.disabled = true;

    loginButton.classList.add(
      "opacity-70",
      "cursor-not-allowed"
    );

    loginButtonText.textContent =
      "Sedang log masuk...";


    try {

      const credential =
        await auth.signInWithEmailAndPassword(
          email,
          password
        );


      // Semakan kedua selepas Firebase login
      const userEmail =
        credential.user.email.toLowerCase();


      if (!PORTAL_ADMIN_EMAILS.includes(userEmail)) {

        await auth.signOut();

        throw new Error(
          "Akses admin tidak dibenarkan."
        );

      }


      showLoginMessage(
        "Log masuk berjaya. Membuka dashboard...",
        "success"
      );


      setTimeout(() => {

        window.location.href =
          "admin-dashboard.html";

      }, 700);


    } catch (error) {

      console.error(
        "Admin login error:",
        error
      );


      let message =
        "Log masuk tidak berjaya. Sila semak e-mel dan kata laluan.";


      if (
        error.code === "auth/invalid-credential" ||
        error.code === "auth/wrong-password" ||
        error.code === "auth/user-not-found"
      ) {

        message =
          "E-mel atau kata laluan tidak betul.";

      }


      if (
        error.code === "auth/too-many-requests"
      ) {

        message =
          "Terlalu banyak percubaan. Sila cuba semula sebentar lagi.";

      }


      showLoginMessage(message);

    } finally {

      loginButton.disabled = false;

      loginButton.classList.remove(
        "opacity-70",
        "cursor-not-allowed"
      );

      loginButtonText.textContent =
        "Log Masuk";

    }

  });
</script>

</body>
</html>
